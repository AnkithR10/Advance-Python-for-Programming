name: Update README contents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate README contents
        run: python scripts/update_readme.py

      - name: Commit README when changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README contents"
          file_pattern: README.md